<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>공지사항 | 한겸복지센터</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script src="../js/tailwind-config.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700;800&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../css/style.css" />
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  </head>
  <body class="bg-background-light dark:bg-background-dark text-slate-900 dark:text-slate-100">
    <div id="nav-placeholder"></div>

    <!-- 히어로 배너 -->
    <section class="relative w-full py-24 overflow-hidden">
      <div class="absolute inset-0 bg-gradient-to-br from-slate-700 via-slate-600 to-slate-500"></div>
      <div class="absolute inset-0 bg-black/25"></div>
      <div class="relative z-10 max-w-7xl mx-auto px-6 lg:px-20">
        <nav class="flex items-center gap-2 text-white/70 text-sm mb-5">
          <a href="../" class="hover:text-white transition-colors">홈</a>
          <span class="material-symbols-outlined" style="font-size:16px;">chevron_right</span>
          <span>한겸복지센터</span>
          <span class="material-symbols-outlined" style="font-size:16px;">chevron_right</span>
          <span class="text-white font-medium">공지사항</span>
        </nav>
        <h1 class="text-5xl lg:text-6xl font-black text-white leading-tight">공지사항</h1>
        <p class="text-white/80 text-xl mt-4">한겸복지센터의 새로운 소식을 전달해 드립니다</p>
      </div>
    </section>

    <!-- 공지사항 목록 -->
    <section class="py-20 bg-white dark:bg-slate-900/50">
      <div class="max-w-4xl mx-auto px-6 lg:px-20">
        <div id="notices-container" class="space-y-4">
          <div class="text-center py-20 text-slate-400">
            <span class="material-symbols-outlined" style="font-size:48px;">hourglass_empty</span>
            <p class="mt-4">불러오는 중...</p>
          </div>
        </div>
      </div>
    </section>

    <div id="footer-placeholder"></div>
    <script src="../js/site-data.js"></script>
    <script src="../js/components.js"></script>
    <script>
      (function () {
        var BASE = location.hostname.endsWith("github.io") ? "/hangeom" : "";

        function formatDate(str) {
          if (!str) return "";
          var d = new Date(str);
          return d.toLocaleDateString("ko-KR", { year: "numeric", month: "long", day: "numeric" });
        }

        function renderItem(item, idx) {
          var bodyHTML = (typeof marked !== "undefined" && item.body)
            ? marked.parse(item.body)
            : (item.body || "").replace(/\n/g, "<br>");

          var imageHTML = item.image
            ? '<img src="' + item.image + '" alt="' + item.title + '" class="w-full rounded-xl object-cover max-h-72 mb-6" />'
            : "";

          return '<article class="bg-background-light dark:bg-slate-800 rounded-2xl border border-primary/10 shadow-md overflow-hidden">'
            + '<button class="w-full text-left px-8 py-6 flex items-center justify-between gap-4 hover:bg-primary/5 transition-colors" onclick="toggle(' + idx + ')">'
            + '<div class="flex-1 min-w-0">'
            + '<p class="text-sm text-primary font-bold mb-1">' + formatDate(item.date) + '</p>'
            + '<h3 class="text-lg font-bold">' + item.title + '</h3>'
            + '</div>'
            + '<span class="material-symbols-outlined flex-shrink-0 transition-transform" id="icon-' + idx + '" style="font-size:24px;">expand_more</span>'
            + '</button>'
            + '<div id="body-' + idx + '" class="hidden px-8 pb-8">'
            + imageHTML
            + '<div class="prose max-w-none text-slate-700 dark:text-slate-300 leading-relaxed space-y-3">' + bodyHTML + '</div>'
            + '</div>'
            + '</article>';
        }

        function renderEmpty() {
          return '<div class="text-center py-20 text-slate-400">'
            + '<span class="material-symbols-outlined" style="font-size:64px;">inbox</span>'
            + '<p class="mt-4 text-lg">등록된 공지사항이 없습니다</p>'
            + '</div>';
        }

        fetch(BASE + "/data/notices.json")
          .then(function (r) { return r.json(); })
          .then(function (data) {
            var items = (data.items || []).slice().reverse();
            var container = document.getElementById("notices-container");
            container.innerHTML = items.length
              ? items.map(renderItem).join("")
              : renderEmpty();
          })
          .catch(function () {
            document.getElementById("notices-container").innerHTML = renderEmpty();
          });

        window.toggle = function (idx) {
          var body = document.getElementById("body-" + idx);
          var icon = document.getElementById("icon-" + idx);
          body.classList.toggle("hidden");
          icon.style.transform = body.classList.contains("hidden") ? "" : "rotate(180deg)";
        };
      })();
    </script>
  </body>
</html>
